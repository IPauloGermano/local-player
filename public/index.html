<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Local Player</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a
        id="home-btn"
        class="topbar-brand-minimal"
        href="#/"
        title="Ir para a Home (Ctrl+clique abre em nova aba)"
        aria-label="Ir para a Home"
      >
        <span class="logo-mark"></span>
      </a>
      <div class="topbar-search">
        <input
          id="search-input"
          type="search"
          placeholder="Buscar cursos ou aulas..."
          autocomplete="off"
        />
      </div>
      <button
        id="rescan-btn"
        class="btn-ghost topbar-rescan-btn"
        title="Reescanear a biblioteca em disco"
        aria-label="Reescanear biblioteca em disco"
      >
        <span class="rescan-icon" aria-hidden="true">⟳</span>
        <span class="rescan-label">Atualizar</span>
      </button>
      <button
        id="settings-btn"
        class="topbar-icon-btn"
        title="Configurações"
        aria-label="Configurações"
        type="button"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <main id="app" class="app"></main>

    <script src="/scope.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
